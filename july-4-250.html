  <style>
    :root {
      color-scheme: light;
      --navy: #071a49;
      --blue: #1557d4;
      --red: #e8223d;
      --white: #fffaf0;
      --gold: #ffd35c;
      --ink: #06122f;
      --muted: #5b6580;
      --line: rgba(7, 26, 73, 0.16);
      --shadow: 0 18px 42px rgba(4, 15, 45, 0.26);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; overscroll-behavior: none; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 211, 92, 0.55), transparent 23%),
        radial-gradient(circle at 84% 12%, rgba(255, 255, 255, 0.48), transparent 24%),
        linear-gradient(180deg, #071a49 0 20%, #ffffff 20% 29%, #e8223d 29% 38%, #ffffff 38% 47%, #e8223d 47% 56%, #ffffff 56% 65%, #1557d4 65% 100%);
      letter-spacing: 0;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button { border: 0; font: inherit; cursor: pointer; touch-action: none; }
    .app { width: min(760px, 100%); min-height: 100svh; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); display: grid; align-items: center; }
    .screen { display: none; width: 100%; }
    .screen.active { display: block; }

    .sound-button {
      position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 5;
      min-height: 40px; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; padding: 0 12px;
      color: #fff; background: rgba(7, 26, 73, .82); box-shadow: 0 10px 24px rgba(0,0,0,.18);
      font-size: .76rem; font-weight: 950; text-transform: uppercase;
    }

    .shell {
      min-height: calc(100svh - 24px); border: 1px solid rgba(255,255,255,.55); border-radius: 8px; overflow: hidden;
      background: rgba(255, 250, 240, .96); box-shadow: var(--shadow);
    }

    .hero, .finale { display: grid; grid-template-rows: minmax(245px, 42svh) auto; }
    .hero-art {
      position: relative; display: grid; place-items: center; overflow: hidden;
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,.9) 0 2px, transparent 3px) 0 0 / 42px 42px,
        linear-gradient(145deg, rgba(7,26,73,.98), rgba(21,87,212,.92));
    }
    .hero-art::before {
      content: ""; position: absolute; inset: auto -8% 0; height: 42%; transform: rotate(-6deg);
      background: repeating-linear-gradient(180deg, #e8223d 0 18px, #fff 18px 36px);
      box-shadow: 0 -18px 36px rgba(0,0,0,.16);
    }
    .hero-badge {
      position: relative; z-index: 1; width: min(315px, 78vw); aspect-ratio: 1.18; border-radius: 8px;
      display: grid; place-items: center; text-align: center; color: #fff;
      background: linear-gradient(135deg, #e8223d, #071a49 48%, #1557d4);
      box-shadow: inset 0 0 0 10px rgba(255,255,255,.18), 0 22px 46px rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.52);
    }
    .hero-badge strong { display: block; font-size: clamp(2.4rem, 13vw, 5.1rem); line-height: .84; text-transform: uppercase; }
    .hero-badge span { display: block; margin-top: 8px; color: var(--gold); font-weight: 950; text-transform: uppercase; }

    .copy { padding: 22px 18px 20px; text-align: center; }
    h1 { margin: 0; color: var(--navy); font-size: clamp(2.25rem, 11vw, 4.6rem); line-height: .92; text-transform: uppercase; }
    .tagline, .small-note { margin: 12px auto 0; max-width: 34rem; color: var(--muted); font-size: clamp(1rem, 4.3vw, 1.16rem); line-height: 1.42; }
    .tagline span { display: block; }
    .start-rules {
      margin: 16px auto 0; max-width: 36rem; border: 2px solid rgba(21,87,212,.18); border-radius: 8px;
      padding: 13px 12px; background: linear-gradient(180deg, #ffffff, #f4f7ff);
      box-shadow: 0 10px 22px rgba(7,26,73,.1); text-align: center;
    }
    .start-rules b { display: block; color: var(--navy); font-size: clamp(1.14rem, 5vw, 1.45rem); line-height: 1.08; text-transform: uppercase; }
    .rule-line { margin-top: 8px; color: var(--ink); font-size: clamp(.94rem, 4vw, 1.05rem); font-weight: 900; line-height: 1.28; }
    .rule-line span { color: var(--red); }
    .creator-credit { display: inline-grid; place-items: center; min-height: 34px; margin-top: 14px; border: 1px solid rgba(7,26,73,.18); border-radius: 999px; padding: 0 14px; color: var(--navy); background: rgba(255,211,92,.72); font-size: .82rem; font-weight: 950; text-transform: uppercase; }
    .primary { width: min(360px, 100%); min-height: 58px; margin-top: 18px; border-radius: 8px; color: #fff; background: linear-gradient(135deg, var(--red), #b80f2a); box-shadow: 0 12px 24px rgba(232, 34, 61, .28); font-weight: 950; text-transform: uppercase; }
    .primary:active, .zone-button:active, .sound-button:active { transform: translateY(2px); }

    .game-shell { min-height: calc(100svh - 24px); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 9px; padding: 10px; background: rgba(255,255,255,.94); }
    .hud { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-right: 92px; }
    .stat { min-height: 54px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; background: #fff; box-shadow: 0 8px 18px rgba(7,26,73,.08); }
    .label { display: block; color: var(--muted); font-size: .68rem; font-weight: 950; text-transform: uppercase; }
    .value { display: block; margin-top: 3px; color: var(--navy); font-size: clamp(1.2rem, 5.8vw, 1.58rem); font-weight: 950; line-height: 1; }
    .fever .label, .fever .value { color: var(--red); }

    .arena { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: linear-gradient(180deg, #071a49, #113a90); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .zone-grid { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .zone-button {
      position: absolute; display: grid; place-items: center; width: clamp(76px, 22vw, 108px); min-height: 44px;
      border-radius: 8px; color: #fff; font-weight: 950; text-transform: uppercase;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 8px 16px rgba(7,26,73,.2); pointer-events: auto;
    }
    .zone-button strong { display: block; font-size: clamp(.86rem, 3.8vw, 1.22rem); line-height: 1; }
    .zone-button span { display: none; }
    .zone-button.sky { top: 8px; left: 50%; transform: translateX(-50%); }
    .zone-button.grill { left: 8px; top: 50%; transform: translateY(-50%); }
    .zone-button.cooler { right: 8px; top: 50%; transform: translateY(-50%); }
    .zone-button.bin { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .zone-button.sky:active { transform: translateX(-50%) translateY(2px); }
    .zone-button.grill:active, .zone-button.cooler:active { transform: translateY(calc(-50% + 2px)); }
    .zone-button.bin:active { transform: translateX(-50%) translateY(2px); }
    .sky { background: linear-gradient(135deg, #1557d4, #071a49); }
    .grill { background: linear-gradient(135deg, #e8223d, #8e1021); }
    .cooler { background: linear-gradient(135deg, #24a8ff, #1557d4); }
    .bin { color: #071a49; background: linear-gradient(135deg, #ffffff, #e8edf8); border: 2px solid rgba(7,26,73,.32); }

    .final-score { margin-top: 10px; color: var(--navy); font-size: clamp(3rem, 17vw, 5.4rem); font-weight: 950; line-height: 1; }

    @media (min-width: 780px) {
      .app { width: min(1050px, 100%); padding: 18px; }
      .hero, .finale { min-height: min(720px, calc(100vh - 36px)); grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
      .copy { display: grid; align-content: center; padding: 34px; }
      .game-shell { min-height: min(820px, calc(100vh - 36px)); grid-template-columns: minmax(0, 1fr) 260px; grid-template-rows: auto minmax(0, 1fr); }
      .hud { grid-column: 1 / -1; }
    }

    @media (max-height: 690px) {
      .hero, .finale { grid-template-rows: minmax(180px, 33svh) auto; }
      .copy { padding: 16px 14px; }
      .primary { min-height: 52px; margin-top: 12px; }
      .tagline, .small-note { font-size: .94rem; }
      .start-rules { margin-top: 11px; padding: 10px; }
      .rule-line { margin-top: 6px; font-size: .82rem; }
      .zone-button { width: clamp(68px, 21vw, 96px); min-height: 40px; }
    }
  </style>

<body>
  <button class="sound-button" id="soundButton" type="button" aria-pressed="true">Music On</button>
  <main class="app">
    <section class="screen active" id="startScreen" aria-labelledby="title">
      <div class="shell hero">
        <div class="hero-art" aria-hidden="true"><div class="hero-badge"><div><strong>Swipe<br>Battle</strong><span>America 250</span></div></div></div>
        <div class="copy">
          <h1 id="title">Cookout Chaos</h1>
          <p class="tagline"><span>A 20-second July 4th swipe battle.</span><span>Sort fast, beat your friends, trigger fireworks.</span></p>
          <div class="start-rules" aria-label="How to play"><b>Swipe items to where they belong.</b></div>
          <div class="creator-credit">Created by Rosina's Agent</div>
          <button class="primary" id="playButton" type="button">Start Battle</button>
        </div>
      </div>
    </section>

    <section class="screen" id="gameScreen" aria-label="Cookout Chaos game">
      <div class="game-shell">
        <div class="hud" aria-live="polite">
          <div class="stat"><span class="label">Time</span><span class="value" id="timeValue">20</span></div>
          <div class="stat"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div>
        </div>
        <div class="arena" id="arena">
          <canvas id="gameCanvas" width="720" height="860" aria-label="Swipe battle area"></canvas>
          <div class="zone-grid">
            <button class="zone-button sky" data-zone="sky" type="button"><strong>Sky</strong><span>Firework</span></button>
            <button class="zone-button grill" data-zone="grill" type="button"><strong>Grill</strong><span>Burger Hotdog Corn</span></button>
            <button class="zone-button cooler" data-zone="cooler" type="button"><strong>Cooler</strong><span>Soda Lemonade</span></button>
            <button class="zone-button bin" data-zone="bin" type="button"><strong>Bin</strong><span>Trash Burnt Wrong</span></button>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="endScreen" aria-labelledby="rankText">
      <div class="shell finale">
        <div class="hero-art" aria-hidden="true"><div class="hero-badge"><div><strong>Final<br>Score</strong><span>Beat this</span></div></div></div>
        <div class="copy">
          <h1 id="rankText">Block Party</h1>
          <div class="final-score" id="finalScore">0</div>
          <p class="small-note" id="finalNote">Send this score to someone and make them prove it.</p>
          <button class="primary" id="replayButton" type="button">Play Again</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const arena = document.getElementById("arena");
      const screens = { start: document.getElementById("startScreen"), game: document.getElementById("gameScreen"), end: document.getElementById("endScreen") };
      const soundButton = document.getElementById("soundButton");
      const timeValue = document.getElementById("timeValue");
      const scoreValue = document.getElementById("scoreValue");
      const finalScore = document.getElementById("finalScore");
      const rankText = document.getElementById("rankText");
      const finalNote = document.getElementById("finalNote");
      const W = 720;
      const H = 860;
      const assetSheet = new Image();
      assetSheet.src = "cookout-chaos-assets-clean.png";
      assetSheet.onload = () => { if (state) render(); };
      const spriteIndex = { burger: 0, hotdog: 1, corn: 2, soda: 3, lemonade: 4, firework: 5, trash: 6, burnt: 7, ticket: 8 };
      const items = [
        { name: "Burger", zone: "grill", kind: "burger" },
        { name: "Hotdog", zone: "grill", kind: "hotdog" },
        { name: "Corn", zone: "grill", kind: "corn" },
        { name: "Soda", zone: "cooler", kind: "soda" },
        { name: "Lemonade", zone: "cooler", kind: "lemonade" },
        { name: "Firework", zone: "sky", kind: "firework" },
        { name: "Trash", zone: "bin", kind: "trash" },
        { name: "Burnt Food", zone: "bin", kind: "burnt" },
        { name: "Wrong Ticket", zone: "bin", kind: "ticket" }
      ];
      let state;
      let lastTime = 0;
      let rafId = 0;
      let pointer = null;
      let audioCtx = null;
      let masterGain = null;
      let musicTimer = 0;
      let musicOn = true;

      function show(name) {
        Object.values(screens).forEach((screen) => screen.classList.remove("active"));
        screens[name].classList.add("active");
      }

      function initAudio() {
        if (audioCtx) return;
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) {
          musicOn = false;
          soundButton.textContent = "No Audio";
          soundButton.setAttribute("aria-pressed", "false");
          return;
        }
        audioCtx = new Context();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.42;
        masterGain.connect(audioCtx.destination);
        startMusic();
      }

      function tone(freq, start, dur, type = "sine", gain = 0.09) {
        if (!audioCtx || !musicOn) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        g.gain.setValueAtTime(0.001, start);
        g.gain.linearRampToValueAtTime(gain, start + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(start);
        osc.stop(start + dur + 0.04);
      }

      function kick(start) {
        if (!audioCtx || !musicOn) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(148, start);
        osc.frequency.exponentialRampToValueAtTime(38, start + 0.22);
        g.gain.setValueAtTime(0.001, start);
        g.gain.linearRampToValueAtTime(0.7, start + 0.008);
        g.gain.exponentialRampToValueAtTime(0.001, start + 0.42);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(start);
        osc.stop(start + 0.46);
      }

      function noiseHit(start, dur, gain, type = "highpass", freq = 1800) {
        if (!audioCtx || !musicOn) return;
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = audioCtx.createBufferSource();
        const g = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        filter.type = type;
        filter.frequency.value = freq;
        g.gain.setValueAtTime(gain, start);
        g.gain.exponentialRampToValueAtTime(0.001, start + dur);
        src.buffer = buffer;
        src.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        src.start(start);
      }

      function snare(start) {
        noiseHit(start, 0.21, 0.32, "bandpass", 1650);
        noiseHit(start + 0.018, 0.12, 0.12, "highpass", 4200);
        tone(174, start, 0.13, "triangle", 0.09);
      }

      function hat(start, open = false) {
        noiseHit(start, open ? 0.18 : 0.045, open ? 0.095 : 0.055, "highpass", 5600);
      }

      function bass(freq, start, dur, slideTo = null) {
        if (!audioCtx || !musicOn) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, start);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, start + dur * 0.72);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(210, start);
        g.gain.setValueAtTime(0.001, start);
        g.gain.linearRampToValueAtTime(0.22, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(filter);
        filter.connect(g);
        g.connect(masterGain);
        osc.start(start);
        osc.stop(start + dur + 0.05);
      }

      function pad(freqs, start, dur) {
        freqs.forEach((freq, index) => {
          tone(freq, start + index * 0.008, dur, "sawtooth", 0.032);
          tone(freq * 2, start + index * 0.01, dur * 0.72, "triangle", 0.012);
        });
      }

      function hook(freq, start, dur = 0.16) {
        tone(freq, start, dur, "square", 0.055);
        tone(freq * 1.5, start + 0.012, dur * 0.54, "triangle", 0.018);
      }

      function synthChop(start, base = 293.66) {
        [0, 0.07, 0.14].forEach((offset, i) => {
          tone(base * [1, 1.122, 0.84][i], start + offset, 0.055, "square", 0.044);
        });
      }

      function startMusic() {
        clearInterval(musicTimer);
        if (!audioCtx) return;
        const step = 60 / 88 / 2;
        const bassLine = [49, 49, 61.74, 49, 73.42, 65.41, 61.74, 41.2];
        const hookLine = [293.66, 329.63, 392, 329.63, 246.94, 293.66, 220, 246.94];
        function bar() {
          if (!musicOn || !audioCtx) return;
          const t = audioCtx.currentTime + 0.04;
          pad([146.83, 220, 293.66], t, step * 7.6);
          pad([130.81, 196, 261.63], t + step * 8, step * 7.2);
          synthChop(t + step * 1.5, 293.66);
          synthChop(t + step * 9.5, 246.94);
          for (let i = 0; i < 16; i += 1) {
            const at = t + i * step;
            if ([0, 3, 6, 8, 10, 14].includes(i)) kick(at);
            if ([4, 12].includes(i)) snare(at);
            if (i % 2 === 0) hat(at, i === 15);
            if ([1, 2, 5, 7, 9, 11, 13, 15].includes(i)) hat(at + step * 0.52, false);
            if ([0, 2, 3, 6, 8, 10, 11, 14].includes(i)) bass(bassLine[i % bassLine.length], at, step * 0.92, i === 11 ? 49 : null);
          }
          [2, 3, 5, 7, 10, 12, 13, 14].forEach((slot, i) => hook(hookLine[i], t + step * slot, i % 2 ? 0.12 : 0.18));
          noiseHit(t + step * 15.5, 0.22, 0.08, "highpass", 3600);
        }
        bar();
        musicTimer = setInterval(bar, step * 16 * 1000);
      }

      function setMusic(on) {
        musicOn = on;
        soundButton.textContent = musicOn ? "Music On" : "Music Off";
        soundButton.setAttribute("aria-pressed", String(musicOn));
        if (masterGain) masterGain.gain.setTargetAtTime(musicOn ? 0.42 : 0, audioCtx.currentTime, 0.03);
        if (musicOn && audioCtx) startMusic();
      }

      function resizeCanvas() {
        const rect = arena.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
      }

      function resetState() {
        state = {
          running: true,
          elapsed: 0,
          score: 0,
          streak: 0,
          fever: 0,
          message: "Sort it fast.",
          messageTone: "white",
          current: null,
          itemAge: 0,
          sortedCount: 0,
          particles: []
        };
        nextItem();
        updateHud();
      }

      function startGame() {
        initAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        setMusic(musicOn);
        resetState();
        show("game");
        resizeCanvas();
        lastTime = performance.now();
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(loop);
      }

      function endGame() {
        state.running = false;
        cancelAnimationFrame(rafId);
        if (state.score >= 35) burst(W / 2, H / 2, 90);
        const rank = getRank(state.score);
        finalScore.textContent = String(state.score);
        rankText.textContent = rank.title;
        finalNote.textContent = rank.note;
        show("end");
      }

      function getRank(score) {
        if (score >= 50) return { title: "250 Legend", note: `Beat this score: ${score}. Screenshot-worthy.` };
        if (score >= 35) return { title: "Firework Mode", note: `Beat this score: ${score}. That run had heat.` };
        if (score >= 20) return { title: "Block Party", note: `Beat this score: ${score}. Clean enough to flex.` };
        return { title: "Rookie", note: `Beat this score: ${score}. Warm-up run, obviously.` };
      }

      function nextItem() {
        const item = items[Math.floor(Math.random() * items.length)];
        state.current = { ...item, x: W / 2, y: H / 2 + 16, r: 74, spin: 0 };
        state.itemAge = 0;
      }

      function choose(zone) {
        if (!state.running || !state.current) return;
        const correct = zone === state.current.zone;
        if (correct) {
          const fast = state.itemAge < 1.1;
          const points = (state.fever > 0 ? 2 : 1) + (fast && state.streak > 0 && state.streak % 5 === 0 ? 1 : 0);
          state.score = Math.min(99, state.score + points);
          state.streak += 1;
          state.message = fast ? `Fast ${state.current.name}: +${points}` : `${state.current.name}: +${points}`;
          state.messageTone = "#ffffff";
          burst(state.current.x, state.current.y, state.streak >= 10 ? 34 : 14);
          if (state.streak === 10 || state.streak % 12 === 0) {
            state.fever = 7;
            state.message = "250 Fever. Double points.";
            bigFireworks();
          }
        } else {
          state.score = Math.max(0, state.score - 1);
          state.streak = 0;
          state.message = `Nope. ${state.current.name} goes to ${state.current.zone.toUpperCase()}.`;
          state.messageTone = "#ffd35c";
        }
        state.sortedCount += 1;
        nextItem();
        updateHud();
      }

      function zoneFromSwipe(dx, dy) {
        if (Math.hypot(dx, dy) < 36) return null;
        if (Math.abs(dy) > Math.abs(dx) && dy < 0) return "sky";
        if (Math.abs(dy) > Math.abs(dx) && dy > 0) return "bin";
        return dx < 0 ? "grill" : "cooler";
      }

      function burst(x, y, count) {
        for (let i = 0; i < count; i += 1) {
          const a = Math.random() * Math.PI * 2;
          const s = 120 + Math.random() * 280;
          state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45 + Math.random() * 0.55, color: ["#ffffff", "#e8223d", "#1557d4", "#ffd35c"][Math.floor(Math.random() * 4)], size: 3 + Math.random() * 5 });
        }
      }

      function bigFireworks() {
        burst(W * 0.25, H * 0.28, 45);
        burst(W * 0.72, H * 0.23, 45);
        burst(W * 0.52, H * 0.36, 34);
      }

      function updateHud() {
        timeValue.textContent = String(Math.max(0, Math.ceil(20 - state.elapsed)));
        scoreValue.textContent = String(state.score);

      }

      function update(dt) {
        state.elapsed += dt;
        state.itemAge += dt;
        state.fever = Math.max(0, state.fever - dt);
        if (state.elapsed >= 20) {
          endGame();
          return;
        }
        state.current.spin += dt * 1.5;
        state.particles = state.particles.filter((p) => {
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 160 * dt;
          return p.life > 0;
        });
        updateHud();
      }

      function drawStar(x, y, outer, inner, points = 5) {
        ctx.beginPath();
        for (let i = 0; i < points * 2; i += 1) {
          const r = i % 2 ? inner : outer;
          const a = -Math.PI / 2 + i * Math.PI / points;
          ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawBackground() {
        ctx.fillStyle = "#071a49";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "rgba(255,255,255,.18)";
        for (let x = 18; x < W; x += 70) for (let y = 20; y < H * 0.48; y += 62) drawStar(x, y, 7, 3.2);
        const stripeH = 46;
        for (let i = 0; i < 8; i += 1) {
          ctx.fillStyle = i % 2 ? "#ffffff" : "#e8223d";
          ctx.fillRect(0, H * 0.58 + i * stripeH, W, stripeH);
        }
        ctx.fillStyle = "rgba(7,26,73,.88)";
        ctx.fillRect(0, 0, W, H);

        ctx.globalAlpha = 1;

      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawItem() {
        const item = state.current;
        if (!item) return;
        const pulse = Math.sin(state.itemAge * 7) * 3;
        const meta = itemMeta(item);
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(Math.sin(item.spin) * 0.035);

        const w = 246;
        const h = 238;
        const x = -w / 2;
        const y = -h / 2;
        const grad = ctx.createLinearGradient(x, y, x + w, y + h);
        grad.addColorStop(0, meta.c1);
        grad.addColorStop(0.54, meta.c2);
        grad.addColorStop(1, "#071a49");

        ctx.shadowColor = meta.glow;
        ctx.shadowBlur = state.fever > 0 ? 34 : 18;
        ctx.fillStyle = grad;
        roundedRect(x, y, w, h, 24);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = state.fever > 0 ? "#ffd35c" : "rgba(255,255,255,.76)";
        ctx.lineWidth = state.fever > 0 ? 7 : 3;
        ctx.stroke();

        ctx.fillStyle = "rgba(255,255,255,.16)";
        for (let i = -80; i < 190; i += 44) ctx.fillRect(x + i, y, 18, h);
        ctx.fillStyle = "rgba(255,255,255,.94)";
        roundedRect(x + 16, y + 14, w - 32, 36, 18);
        ctx.fill();
        ctx.fillStyle = meta.c1;
        ctx.font = "950 18px Segoe UI, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(meta.header, 0, y + 33);

        drawIcon(item.kind, 0, y + 102 + pulse, 1);

        ctx.fillStyle = "#ffffff";
        ctx.font = item.name.length > 10 ? "950 28px Segoe UI, sans-serif" : "950 34px Segoe UI, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.name.toUpperCase(), 0, y + 174);

        ctx.fillStyle = "rgba(255,255,255,.92)";
        roundedRect(-72, y + 194, 144, 28, 14);
        ctx.fill();
        ctx.fillStyle = "#071a49";
        ctx.font = "950 14px Segoe UI, sans-serif";
        ctx.fillText("TO " + item.zone.toUpperCase(), 0, y + 208);
        ctx.restore();
      }

      function itemMeta(item) {
        if (item.zone === "grill") return { header: "COOKOUT DROP", c1: "#e8223d", c2: "#8e1021", glow: "rgba(232,34,61,.55)" };
        if (item.zone === "cooler") return { header: "COLD DRINK", c1: "#1557d4", c2: "#24a8ff", glow: "rgba(36,168,255,.55)" };
        if (item.zone === "sky") return { header: "LAUNCH ITEM", c1: "#071a49", c2: "#1557d4", glow: "rgba(255,211,92,.6)" };
        return { header: "CHAOS ITEM", c1: "#32394a", c2: "#111827", glow: "rgba(7,26,73,.5)" };
      }

      function drawIcon(kind, x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        if (assetSheet.complete && assetSheet.naturalWidth) {
          const index = spriteIndex[kind] ?? 0;
          const cols = 3;
          const cell = assetSheet.naturalWidth / cols;
          const sx = (index % cols) * cell;
          const sy = Math.floor(index / cols) * cell;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(assetSheet, sx + cell * 0.08, sy + cell * 0.08, cell * 0.84, cell * 0.84, -82, -82, 164, 164);
        } else {
          ctx.fillStyle = "rgba(255,255,255,.94)";
          ctx.beginPath();
          ctx.arc(0, 0, 70, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#071a49";
          ctx.font = "950 28px Segoe UI, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(kind.toUpperCase().slice(0, 4), 0, 0);
        }
        ctx.restore();
      }

      function drawParticles() {
        state.particles.forEach((p) => {
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }



      function render() {
        drawBackground();
        drawItem();
        drawParticles();
      }

      function loop(now) {
        const dt = Math.min(0.034, (now - lastTime) / 1000 || 0);
        lastTime = now;
        update(dt);
        render();
        if (state.running) rafId = requestAnimationFrame(loop);
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: ((event.clientX - rect.left) / rect.width) * W, y: ((event.clientY - rect.top) / rect.height) * H };
      }

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        pointer = canvasPoint(event);
      });
      canvas.addEventListener("pointerup", (event) => {
        event.preventDefault();
        if (!pointer) return;
        const end = canvasPoint(event);
        const zone = zoneFromSwipe(end.x - pointer.x, end.y - pointer.y);
        pointer = null;
        if (zone) choose(zone);
      });
      canvas.addEventListener("pointercancel", () => { pointer = null; });

      document.querySelectorAll("[data-zone]").forEach((button) => button.addEventListener("click", () => choose(button.dataset.zone)));
      document.getElementById("playButton").addEventListener("click", startGame);
      document.getElementById("replayButton").addEventListener("click", startGame);
      soundButton.addEventListener("click", () => {
        initAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        setMusic(!musicOn);
      });
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 120));
      window.addEventListener("keydown", (event) => {
        const map = { ArrowUp: "sky", w: "sky", W: "sky", ArrowDown: "bin", s: "bin", S: "bin", ArrowLeft: "grill", a: "grill", A: "grill", ArrowRight: "cooler", d: "cooler", D: "cooler" };
        if (!map[event.key]) return;
        event.preventDefault();
        choose(map[event.key]);
      });
      resizeCanvas();
    })();
  </script>
</body>
</html>
